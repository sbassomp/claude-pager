include:
  - template: Auto-DevOps.gitlab-ci.yml

variables:
  # claude-pager ships as an npm package: no container image to build (or
  # scan). The buildpack build also breaks on the runner's Docker 29 image store.
  BUILD_DISABLED: 'true'
  CONTAINER_SCANNING_DISABLED: 'true'

# The template's CodeClimate engines are no longer pullable: report ESLint
# findings in GitLab's Code Quality format instead.
code_quality:
  image: node:22
  services: []
  script:
    - npm ci --no-audit --no-fund
    - npx eslint src/ -f ./tools/eslint-gitlab-formatter.mjs -o gl-code-quality-report.json
